# ── Pre-commit hooks — รันก่อน commit ทุกครั้ง ──────────────────────────────
# ติดตั้งครั้งแรก:  ./venv/Scripts/python.exe -m pre_commit install
# รันทุกไฟล์มือ:   ./venv/Scripts/python.exe -m pre_commit run --all-files
# ใช้เฉพาะ local hooks ที่เรียกผ่าน venv ของโปรเจกต์ (ไม่พึ่ง network ตอน commit)
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: venv/Scripts/python.exe -m ruff check --fix
        language: system
        types: [python]
        exclude: '^(_archive|venv|data|frontend/vendor)/'
      - id: ruff-format
        name: ruff format (auto format)
        entry: venv/Scripts/python.exe -m ruff format
        language: system
        types: [python]
        exclude: '^(_archive|venv|data|frontend/vendor|scripts)/'
      - id: pytest-fast
        name: pytest (characterization tests)
        entry: venv/Scripts/python.exe -m pytest
        language: system
        pass_filenames: false
        stages: [pre-commit]