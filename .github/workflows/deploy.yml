# ── GitHub Actions: auto build + deploy ขึ้น VPS ─────────────────────────────
# ทุกครั้งที่ push เข้า main → SSH เข้า VPS → git pull → docker compose up -d --build
#
# ตั้งค่าใน GitHub repo → Settings → Secrets and variables → Actions:
#   VPS_HOST      = IP หรือ domain ของ VPS
#   VPS_USER      = user ที่ใช้ SSH เข้า VPS (เช่น linuxuser)
#   SSH_KEY       = private key (ed25519) ที่ใช้ SSH เข้า VPS (paste ทั้งก้อน)
#   VPS_DIR       = (ทางเลือก) path ที่ clone repo ไว้บน VPS
#                   ไม่ตั้ง = ใช้ $HOME/My_Bot  ·· ตั้งไว้ = ใช้ค่านี้แทน
#                   ⚠️ ต้องตรงกับ path จริงบน VPS ไม่งั้น workflow จะ cd ไม่เจอ
#
# ── ข้อกำหนดบน VPS (ต้องทำก่อน workflow จะทำงาน) ─────────────────────────────
#   1. ติดตั้ง Docker + ตั้ง user ให้มีสิทธิ์ docker
#        sudo usermod -aG docker $USER      # แล้ว logout/login ใหม่ (หรือ reboot)
#      → ถ้าใช้ docker group ตรงๆ ต่อได้เลย อย่าใช้ sudo ในคำสั่ง (ssh ไม่มี TTY
#        ให้พิมพ์ password)  workflow นี้เลยสั่ง docker ตรงๆ (ไม่ใช้ sudo)
#   2. clone repo ไปไว้ที่ path ที่จะใช้จริง (ค่า default ของ workflow = $HOME/My_Bot):
#        cd ~
#        git clone https://github.com/Khemachat2003/My_Bot.git My_Bot
#        cd My_Bot && cp .env.example .env && nano .env          # ตั้งค่า
#        mkdir -p data && docker compose up -d --build            # ลองรันครั้งแรกด้วยมือ
#        (ถ้าใช้ path อื่น เช่น /opt/xauusd-bot ให้ตั้ง secret VPS_DIR ให้ตรง path)
#   3. ตรวจว่าคำสั่ง docker ผ่าน SSH โดยไม่ต้องพิมพ์รหัสผ่าน:
#        ssh -i ~/.ssh/id_ed25519 linuxuser@<vps-ip> "docker ps"
#      ถ้าได้ "permission denied" → logout แล้ว login ใหม่ (docker group มีผลตอน login เท่านั้น)
#
# หมายเหตุ: ถ้า deploy.yml ยังไม่แน่ใจ ช่วงทดสอบให้ deploy มือก่อน
#   (git pull && docker compose up -d --build) แล้วค่อยเปิด auto-deploy
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:      # ให้กด deploy ด้วยมือได้จากหน้า Actions

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: github.repository != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            DEPLOY_DIR="${VPS_DIR:-$HOME/My_Bot}"
            cd "$DEPLOY_DIR" || { echo "PATH: ไม่พบ $DEPLOY_DIR — ตั้งค่า path ให้ตรง (ดู DEPLOY.md ข้อ 3)"; exit 1; }
            git pull --ff-only
            docker compose up -d --build --pull always
            echo "--- commit ที่ deploy ---"
            git rev-parse --short HEAD
            echo "--- ตรวจ healthcheck ---"
            sleep 8
            curl -s -f http://127.0.0.1:8000/api/health || echo "WARNING: health ยังไม่ตอบ (อาจยัง boot) — ดู logs ด้วย docker compose logs -f"
            docker compose ps
          '
