# ─────────────────────────────────────────────────────────────────────────────
# nginx reverse proxy — ต่อ domain/HTTPS เข้าหน้า dashboard (port 8000)
# วิธีใช้:
#   sudo cp deploy/nginx/xauusd.conf /etc/nginx/sites-available/xauusd
#   sudo ln -s /etc/nginx/sites-available/xauusd /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# หมายเหตุ: WebSocket ยังไม่ใช้ในโปรเจกต์ (polling ล้วน) แต่ proxy ไว้เผื่ออนาคต
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name trade.example.com;   # ← เปลี่ยนเป็น domain จริง หรือ IP

    # กัน request ใหญ่/ช้าเกินไป
    client_max_body_size 2m;

    # หน้า dashboard (backend ใช้ session cookie)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # timeout ฝั่ง proxy ให้ช้ากว่า uvicorn เล็กน้อย
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket (เผื่ออนาคต)
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ให้ CDN/Cloudflare แคช assets ได้
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }
}

