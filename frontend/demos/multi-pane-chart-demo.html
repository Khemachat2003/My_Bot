<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-pane Chart Demo — RSI/ADX/Volume แยกแถบจริง</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#131722;--panel:#1A1E29;--border:#2A2E39;--text:#D1D4DC;--muted:#787B86;--up:#26A69A;--down:#EF5350;--warn:#FF9800;--accent:#2962FF;--ml:#9C6FE0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:13px;}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.tbtn{background:none;border:1px solid transparent;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 9px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.tbtn:hover{background:var(--panel);color:var(--text);}
.pane{border-bottom:1px solid var(--border);position:relative;}
.pane-label{position:absolute;top:4px;left:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);z-index:2;pointer-events:none;background:rgba(19,23,34,.6);padding:2px 6px;border-radius:3px;}
.legend{padding:8px 14px;font-size:11px;color:var(--muted);display:flex;gap:16px;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
</style>
</head>
<body>

<div class="toolbar">
  <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;margin-right:10px;">XAU/USD — M5</span>
  <button class="tbtn" id="btnFs">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <span id="fsLbl">เต็มจอ</span>
  </button>
  <button class="tbtn" id="btnReset">รีเซ็ตมุมมอง</button>
</div>

<div id="root">
  <div class="pane" style="height:340px;"><span class="pane-label">ราคา</span><div id="paneMain" style="height:340px;"></div></div>
  <div class="pane" style="height:90px;"><span class="pane-label">Volume</span><div id="paneVol" style="height:90px;"></div></div>
  <div class="pane" style="height:100px;"><span class="pane-label">RSI (14)</span><div id="paneRsi" style="height:100px;"></div></div>
  <div class="pane" style="height:100px;"><span class="pane-label">ADX (14)</span><div id="paneAdx" style="height:100px;"></div></div>
</div>

<div class="legend">
  <span><i style="background:#FF9800;"></i>Fractal สูง (แนวต้าน)</span>
  <span><i style="background:#26A69A;"></i>Fractal ต่ำ (แนวรับ)</span>
  <span><i style="background:#9C6FE0;"></i>RSI</span>
  <span><i style="background:#FF9800;"></i>ADX</span>
</div>

<script>
// ── สร้างข้อมูลจำลอง ──
let t=Math.floor(Date.now()/1000)-300*160, price=2405;
const bars=[], vol=[], rsi=[], adx=[];
for(let i=0;i<160;i++){
  const o=price, c=o+(Math.random()-0.48)*4;
  const h=Math.max(o,c)+Math.random()*2, l=Math.min(o,c)-Math.random()*2;
  bars.push({time:t,open:o,high:h,low:l,close:c});
  vol.push({time:t,value:200+Math.random()*800,color:c>=o?'rgba(38,166,154,.5)':'rgba(239,83,80,.5)'});
  rsi.push({time:t,value:30+Math.random()*40});
  adx.push({time:t,value:15+Math.random()*35});
  price=c; t+=300;
}

const commonOpts={
  layout:{background:{color:'#131722'},textColor:'#787B86',fontFamily:'IBM Plex Mono, monospace'},
  grid:{vertLines:{color:'#1E222D'},horzLines:{color:'#1E222D'}},
  rightPriceScale:{borderColor:'#2A2E39'},
  timeScale:{borderColor:'#2A2E39',visible:false},
};

// ── pane ราคาหลัก (มีแกนเวลาจริง) ──
const chartMain=LightweightCharts.createChart(document.getElementById('paneMain'),{
  ...commonOpts, timeScale:{...commonOpts.timeScale,visible:false},
});
const candle=chartMain.addCandlestickSeries({upColor:'#26A69A',downColor:'#EF5350',borderVisible:false,wickUpColor:'#26A69A',wickDownColor:'#EF5350'});
candle.setData(bars);

// ── fractal marker 2 สี (สูง=ส้ม แนวต้าน / ต่ำ=เขียว แนวรับ) ──
function fractal(data,l=7,r=7){
  const out=[];
  for(let i=l;i<data.length-r;i++){
    const win=data.slice(i-l,i+r+1);
    if(data[i].high===Math.max(...win.map(x=>x.high))) out.push({i,t:'H'});
    if(data[i].low===Math.min(...win.map(x=>x.low))) out.push({i,t:'L'});
  }
  return out;
}
const fr=fractal(bars);
candle.setMarkers(fr.map(p=>({
  time:bars[p.i].time,
  position:p.t==='H'?'aboveBar':'belowBar',
  color:p.t==='H'?'#FF9800':'#26A69A',
  shape:p.t==='H'?'arrowDown':'arrowUp',
  text:'',
})).sort((a,b)=>a.time-b.time));

// ── pane volume (คนละ instance จริง มีพื้นหลัง/เส้นตารางแยกจากราคา 100%) ──
const chartVol=LightweightCharts.createChart(document.getElementById('paneVol'),{
  ...commonOpts, timeScale:{...commonOpts.timeScale,visible:false},
});
const volSeries=chartVol.addHistogramSeries({priceFormat:{type:'volume'}});
volSeries.setData(vol);

// ── pane RSI (แถบแยกจริง มีเส้น 70/30 ของตัวเอง ไม่ทับราคา) ──
const chartRsi=LightweightCharts.createChart(document.getElementById('paneRsi'),{
  ...commonOpts, timeScale:{...commonOpts.timeScale,visible:false},
});
const rsiSeries=chartRsi.addLineSeries({color:'#9C6FE0',lineWidth:1});
rsiSeries.setData(rsi);
rsiSeries.createPriceLine({price:70,color:'rgba(120,123,134,.45)',lineStyle:LightweightCharts.LineStyle.Dotted,title:'70'});
rsiSeries.createPriceLine({price:30,color:'rgba(120,123,134,.45)',lineStyle:LightweightCharts.LineStyle.Dotted,title:'30'});

// ── pane ADX (แถบแยกจริง มีแกนเวลาแสดงอยู่แถบล่างสุด) ──
const chartAdx=LightweightCharts.createChart(document.getElementById('paneAdx'),{
  ...commonOpts, timeScale:{...commonOpts.timeScale,visible:true,timeVisible:true},
});
const adxSeries=chartAdx.addLineSeries({color:'#FF9800',lineWidth:1});
adxSeries.setData(adx);
adxSeries.createPriceLine({price:20,color:'rgba(120,123,134,.5)',lineStyle:LightweightCharts.LineStyle.Dotted,title:'20'});

// ── sync การ pan/zoom ของทุก pane เข้าด้วยกัน (ลากหรือซูมแถบไหนแถบอื่นขยับตาม) ──
const allCharts=[chartMain,chartVol,chartRsi,chartAdx];
let syncing=false;
allCharts.forEach(c=>{
  c.timeScale().subscribeVisibleLogicalRangeChange(range=>{
    if(syncing||!range) return;
    syncing=true;
    allCharts.forEach(o=>{ if(o!==c) o.timeScale().setVisibleLogicalRange(range); });
    syncing=false;
  });
});

document.getElementById('btnReset').onclick=()=>chartMain.timeScale().fitContent();

// ── fullscreen toggle ที่ถูกต้อง: เช็คสถานะก่อนตัดสินใจเข้า/ออก ──
document.getElementById('btnFs').onclick=()=>{
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  document.getElementById('root').requestFullscreen();
};
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('fsLbl').textContent=document.fullscreenElement?'ย่อจอ':'เต็มจอ';
});

window.addEventListener('resize',()=>{
  allCharts.forEach(c=>c.applyOptions({width:c.chartElement?.parentElement?.clientWidth}));
});
</script>
</body>
</html>
