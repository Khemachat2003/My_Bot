<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingView-style Chart Demo</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131722; --panel:#1A1E29; --border:#2A2E39;
  --text:#D1D4DC; --muted:#787B86;
  --up:#26A69A; --down:#EF5350; --warn:#FF9800; --accent:#2962FF; --ml:#9C6FE0;
  --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13px;}

.toolbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);}
.toolbar .sym{font-family:var(--font-mono);font-weight:600;font-size:13px;margin-right:10px;}
.tbtn{background:none;border:1px solid transparent;color:var(--muted);font-family:var(--font-mono);font-size:11px;padding:5px 9px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.tbtn:hover{background:var(--panel);color:var(--text);}
.tbtn.active{background:var(--panel);color:var(--accent);border-color:var(--accent);}
.spacer{flex:1;}
.icon{width:14px;height:14px;flex-shrink:0;}

.legend{position:absolute;top:56px;left:14px;font-family:var(--font-mono);font-size:11px;color:var(--text);background:rgba(19,23,34,.7);padding:4px 8px;border-radius:4px;z-index:5;pointer-events:none;}
.legend .up{color:var(--up);} .legend .down{color:var(--down);}

.wrap{position:relative;}
#chart{width:100%;}
#vol{width:100%;}

.sr-panel{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border);flex-wrap:wrap;}
.sr-chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-family:var(--font-mono);font-size:11px;}
.sr-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:0;}

.trade-list{border-top:1px solid var(--border);padding:10px 14px;}
.trade-list-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.trade-row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:4px;cursor:pointer;font-size:12px;}
.trade-row:hover{background:var(--panel);}
.trade-row.selected{background:var(--panel);outline:1px solid var(--accent);}
.trade-row .dir{width:44px;font-weight:600;font-family:var(--font-mono);}
.trade-row .dir.bull{color:var(--up);} .trade-row .dir.bear{color:var(--down);}
.trade-row .sys{width:52px;font-size:10px;color:var(--muted);}
.trade-row .sys.ml{color:var(--ml);}
.trade-row .price{font-family:var(--font-mono);color:var(--muted);}
</style>
</head>
<body>

<div class="toolbar">
  <span class="sym">XAU/USD</span>
  <button class="tbtn active">M5</button>
  <button class="tbtn">M15</button>
  <button class="tbtn">H1</button>
  <span class="spacer"></span>
  <button class="tbtn" id="addSrBtn">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><circle cx="17" cy="12" r="2"/></svg>
    เพิ่มเส้น S/R
  </button>
  <button class="tbtn" id="resetBtn">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    รีเซ็ตมุมมอง
  </button>
</div>

<div class="wrap">
  <div class="legend" id="legend">XAUUSD · M5 · O <span></span> H <span></span> L <span></span> C <span></span></div>
  <div id="chart"></div>
  <div id="vol" style="height:70px;"></div>
</div>

<div class="sr-panel" id="srPanel">
  <span style="color:var(--muted);font-size:11px;">เส้นที่เพิ่มเอง:</span>
</div>

<div class="trade-list">
  <div class="trade-list-title">คลิกแถวเพื่อดู Entry / SL / TP บนกราฟ (เห็นทีละรายการ ไม่ปนกัน)</div>
  <div class="trade-row" data-i="0"><span class="dir bull">CALL</span><span class="sys ml">ML</span><span class="price">Entry 2411.20 · SL 2408.00 · TP1 2413.50 · TP2 2416.00</span></div>
  <div class="trade-row" data-i="1"><span class="dir bear">PUT</span><span class="sys">IMP1</span><span class="price">Entry 2415.60 · SL 2418.20 · TP1 2413.10 · TP2 2410.80</span></div>
  <div class="trade-row" data-i="2"><span class="dir bull">CALL</span><span class="sys">IMP2</span><span class="price">Entry 2409.90 · SL 2407.50 · TP1 2412.00 · TP2 2414.60</span></div>
</div>

<script>
// ── สร้างข้อมูลแท่งเทียนจำลอง ──
let t = Math.floor(Date.now()/1000) - 300*160;
let price = 2405;
const bars = [];
for(let i=0;i<160;i++){
  const o = price;
  const c = o + (Math.random()-0.48)*4;
  const h = Math.max(o,c) + Math.random()*2;
  const l = Math.min(o,c) - Math.random()*2;
  bars.push({time:t, open:o, high:h, low:l, close:c});
  price = c; t += 300;
}
const volBars = bars.map(b=>({time:b.time, value: 200+Math.random()*800, color: b.close>=b.open? 'rgba(38,166,154,.5)':'rgba(239,83,80,.5)'}));

// ── ธีมอิง TradingView จริง ──
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  height: 420,
  layout:{ background:{color:'#131722'}, textColor:'#D1D4DC', fontFamily:'IBM Plex Mono, monospace' },
  grid:{ vertLines:{color:'#1E222D'}, horzLines:{color:'#1E222D'} },
  crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
  rightPriceScale:{ borderColor:'#2A2E39' },
  timeScale:{ borderColor:'#2A2E39', timeVisible:true },
});
const series = chart.addCandlestickSeries({
  upColor:'#26A69A', downColor:'#EF5350', borderVisible:false,
  wickUpColor:'#26A69A', wickDownColor:'#EF5350',
});
series.setData(bars);

const volChart = LightweightCharts.createChart(document.getElementById('vol'), {
  height:70,
  layout:{ background:{color:'#131722'}, textColor:'#787B86', fontFamily:'IBM Plex Mono, monospace' },
  grid:{ vertLines:{color:'#1E222D'}, horzLines:{color:'#1E222D'} },
  timeScale:{ borderColor:'#2A2E39', visible:false },
  rightPriceScale:{ borderColor:'#2A2E39' },
});
const volSeries = volChart.addHistogramSeries({ priceFormat:{type:'volume'} });
volSeries.setData(volBars);

// ── sync การซูม/เลื่อนของกราฟราคา กับกราฟ volume ──
chart.timeScale().subscribeVisibleLogicalRangeChange(range=>{
  if(range) volChart.timeScale().setVisibleLogicalRange(range);
});

// ── legend OHLC แบบ crosshair (TradingView ทำแบบนี้) ──
const legendSpans = document.querySelectorAll('#legend span');
chart.subscribeCrosshairMove(param=>{
  const d = param.seriesData.get(series);
  if(!d) return;
  legendSpans[0].textContent=d.open?.toFixed(2);
  legendSpans[1].textContent=d.high?.toFixed(2);
  legendSpans[2].textContent=d.low?.toFixed(2);
  legendSpans[3].textContent=d.close?.toFixed(2);
});

// ── entry marker: รูปทรง=ทิศทาง(ขึ้น/ลง) สี=ระบบต้นทาง(ML/Rule-based) ──
const trades = [
  {i:0, dir:'CALL', sys:'ML',   sysColor:'#9C6FE0', barIdx:60,  entry:2411.20, sl:2408.00, tp1:2413.50, tp2:2416.00},
  {i:1, dir:'PUT',  sys:'IMP1', sysColor:'#2962FF', barIdx:95,  entry:2415.60, sl:2418.20, tp1:2413.10, tp2:2410.80},
  {i:2, dir:'CALL', sys:'IMP2', sysColor:'#2962FF', barIdx:130, entry:2409.90, sl:2407.50, tp1:2412.00, tp2:2414.60},
];
series.setMarkers(trades.map(tr=>({
  time: bars[tr.barIdx].time,
  position: tr.dir==='CALL' ? 'belowBar' : 'aboveBar',
  color: tr.sysColor,
  shape: tr.dir==='CALL' ? 'arrowUp' : 'arrowDown',
  text: tr.sys + ' ' + tr.dir,
})));

// ── SL/TP price line: วาดเฉพาะ trade ที่เลือก ไม่ปนกับ trade อื่น ──
let activeLines = [];
function clearLines(){ activeLines.forEach(l=>series.removePriceLine(l)); activeLines=[]; }
function showTrade(tr){
  clearLines();
  activeLines.push(series.createPriceLine({price:tr.entry, color:'#D1D4DC', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Solid, title:'ENTRY'}));
  activeLines.push(series.createPriceLine({price:tr.sl,    color:'#EF5350', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dashed, title:'SL'}));
  activeLines.push(series.createPriceLine({price:tr.tp1,   color:'#FF9800', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dashed, title:'TP1'}));
  activeLines.push(series.createPriceLine({price:tr.tp2,   color:'#26A69A', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dashed, title:'TP2'}));
}
document.querySelectorAll('.trade-row').forEach(row=>{
  row.onclick=()=>{
    document.querySelectorAll('.trade-row').forEach(r=>r.classList.remove('selected'));
    row.classList.add('selected');
    showTrade(trades[+row.dataset.i]);
  };
});
document.querySelector('.trade-row').click();

// ── S/R line ที่ผู้ใช้เพิ่มเอง: กดปุ่มแล้วคลิกบนกราฟเพื่อวางเส้นตรงราคานั้น ──
let addingSr = false;
let userLines = [];
document.getElementById('addSrBtn').onclick = ()=>{ addingSr = true; document.getElementById('chart').style.cursor='crosshair'; };
chart.subscribeClick(param=>{
  if(!addingSr || !param.point) return;
  const p = series.coordinateToPrice(param.point.y);
  const line = series.createPriceLine({price:p, color:'#787B86', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dotted, title:'S/R'});
  const id = Date.now();
  userLines.push({id, line, price:p});
  const chip=document.createElement('span');
  chip.className='sr-chip';
  chip.innerHTML=`${p.toFixed(2)} <button>✕</button>`;
  chip.querySelector('button').onclick=()=>{
    series.removePriceLine(line);
    userLines = userLines.filter(u=>u.id!==id);
    chip.remove();
  };
  document.getElementById('srPanel').appendChild(chip);
  addingSr=false; document.getElementById('chart').style.cursor='default';
});

document.getElementById('resetBtn').onclick=()=>chart.timeScale().fitContent();
</script>
</body>
</html>
