<!-- Hero Signal Card (C-8 ชุด B) — สัญญาณ M1 ตัวใหญ่ + เกต + prob bars + countdown M1/M5
     ข้อมูลจาก /api/ml/latest (endpoint เดิม) — ถูก render โดย features/hero/hero.js -->
<div class="panel hero-signal">
  <div class="hero-top">
    <span class="hero-label"><span class="live-dot"></span>สัญญาณตอนนี้<span class="hero-src">ML · M1</span></span>
    <span class="hero-gate off" id="heroGate">–</span>
  </div>
  <div class="hero-main">
    <span class="hero-dir muted" id="heroDir">○ รอสัญญาณ</span>
    <span class="hero-conf" id="heroConf">–</span>
  </div>
  <div class="hero-bars">
    <div class="hero-bar-row"><span>▲</span><div class="hbar up"><i id="heroBarUp" style="width:0%"></i></div><b id="heroUpPct">–</b></div>
    <div class="hero-bar-row"><span>▼</span><div class="hbar dn"><i id="heroBarDn" style="width:0%"></i></div><b id="heroDnPct">–</b></div>
  </div>
  <div class="hero-cd">
    <span><span class="cd-lbl">M1 ปิด</span><b id="heroCdM1">–</b></span>
    <span><span class="cd-lbl">M5 ปิด</span><b id="heroCdM5">–</b></span>
    <span class="h-sub muted" id="heroM5" style="margin-left:auto;">รอข้อมูล</span>
  </div>
</div>
