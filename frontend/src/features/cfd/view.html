<!-- ─── CFD BACKTEST (Phase C-2: กลายเป็น sub-tab pane ของ tab-performance) ─── -->
  <div class="subtab-pane" id="pane-cfd" data-pane="cfd" style="display:none;">
    <div class="j-col">
      <!-- params bar -->
      <div class="j-section open">
        <div class="j-section-head" data-toggle-parent="open">
          <h3>CFD Parameters</h3><span class="j-arrow">▾</span>
        </div>
        <div class="j-section-body" style="padding:12px;">
          <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center; font-size:11px;">
            <label>ทุน $<input id="cfdCapital" type="number" value="5000" min="100" max="100000" style="width:70px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 6px;font-size:11px;"></label>
            <label>SL (pip) <input id="cfdSL" type="number" value="20" min="5" max="100" step="1" style="width:50px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 6px;font-size:11px;"></label>
            <label>TP1 (pip) <input id="cfdTP1" type="number" value="40" min="10" max="200" step="1" style="width:50px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 6px;font-size:11px;"></label>
            <label>TP2 (pip) <input id="cfdTP2" type="number" value="60" min="10" max="300" step="1" style="width:50px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 6px;font-size:11px;"></label>
            <label>Spread <input id="cfdSpread" type="number" value="1.5" min="0" max="10" step="0.5" style="width:50px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 6px;font-size:11px;"></label>
            <label>Risk % <input id="cfdRisk" type="number" value="1" min="0.1" max="10" step="0.1" style="width:50px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 6px;font-size:11px;"></label>
            <select id="cfdSignalType" style="background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 8px;font-size:11px;">
              <option value="ALL">All Systems</option>
              <option value="SETUP">Rule-Based Only</option>
              <option value="ML">ML Only</option>
            </select>
            <button id="btnRunCfdBacktest" style="background:var(--warn);color:#000;border:none;border-radius:4px;padding:4px 14px;font-size:11px;font-weight:700;cursor:pointer;">Run Backtest</button>
          </div>
        </div>
      </div>

      <!-- summary cards -->
      <div id="cfdSummary" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:14px;"></div>

      <!-- ═══ CFD PAPER TRADING ═══ -->
      <div class="j-section open" style="margin-top:14px;">
        <div class="j-section-head" data-toggle-parent="open">
          <h3>CFD Paper Trading (Real-time)</h3><span class="j-arrow">▾</span>
        </div>
        <div class="j-section-body" style="padding:12px;">
          <div id="cfdPaperSummary" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;"></div>
          <div id="cfdOpenTrades" style="margin-top:12px;"></div>
          <div class="tbl-wrap" style="margin-top:12px;">
            <h4 style="color:var(--muted);font-size:11px;margin-bottom:6px;">Resolved Trades</h4>
            <table id="cfdPaperTable">
              <thead><tr>
                <th>#</th><th>Time</th><th>System</th><th>Dir</th><th>Entry</th>
                <th>SL</th><th>TP1</th><th>TP2</th><th>Result</th><th>Exit</th>
                <th>Hold</th><th>P&L</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TP1 vs TP2 comparison -->
      <div class="j-section" style="margin-top:14px;">
        <div class="j-section-head" data-toggle-parent="open">
          <h3>TP1 vs TP2 Comparison</h3><span class="j-arrow">▾</span>
        </div>
        <div class="j-section-body">
          <div class="tbl-wrap">
            <table id="cfdCompareTable">
              <thead><tr>
                <th>System</th><th>Direction</th>
                <th colspan="3">TP1 (R:R 1:2)</th>
                <th colspan="3">TP2 (R:R 1:3)</th>
              </tr>
              <tr>
                <th></th><th></th>
                <th>Trades</th><th>WR%</th><th>P&L</th>
                <th>Trades</th><th>WR%</th><th>P&L</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- trade list -->
      <div class="j-section" style="margin-top:14px;">
        <div class="j-section-head" data-toggle-parent="open">
          <h3>Trade List</h3><span class="j-arrow">▾</span>
        </div>
        <div class="j-section-body">
          <div class="tbl-wrap">
            <table id="cfdTradeTable">
              <thead><tr>
                <th>#</th><th>System</th><th>Dir</th><th>Entry</th>
                <th>TP1</th><th>TP2</th><th>P&L (TP1)</th><th>P&L (TP2)</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
