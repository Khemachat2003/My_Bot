<!-- ═══════════ TOP BAR (C-9 ตาม mockup: sym chip + price head + px-meta) ═══════════ -->
<div class="topbar">
  <!-- C-7: hamburger เปิด drawer — โชว์เฉพาะจอ ≤768px (responsive.css); desktop display:none = pixel เดิม -->
  <button type="button" class="nav-toggle" id="navToggle" aria-label="เปิดเมนู" aria-expanded="false"><i class="ti ti-menu"></i></button>
  <div class="brand">
    <div class="logo">X</div>
    <div>
      <div class="name">XAUUSD<span> PRO</span> TERMINAL</div>
      <div class="ver">ML + RULE-BASED MONITOR</div>
    </div>
  </div>

  <!-- sym chip (mockup): ไอคอนทอง Au + ชื่อ + คำอธิบาย + chevron -->
  <div class="sym-chip" id="symChip">
    <span class="au-ic">Au</span>
    <span class="sym-meta">
      <span class="sym-name"><b id="symbolBadge">XAUUSD</b><i class="ti ti-chevron-down"></i></span>
      <span class="sym-sub" id="symbolSub">ทองคำ · Gold Spot</span>
    </span>
  </div>

  <!-- price head (mockup): ราคาใหญ่ + chg ลูกศร -->
  <div class="price-head">
    <span class="price" id="tickerPrice">–</span>
    <span class="chg" id="tickerChg"></span>
  </div>

  <!-- px-meta (mockup): LIVE + สูง/ต่ำช่วง 24 ชม. (คำนวณจากแท่งเทียนที่โหลด — ไม่เพิ่ม request) -->
  <div class="px-meta">
    <span class="px-live"><span class="live-dot"></span>LIVE</span>
    <span class="px-hl">สูง/ต่ำ <b id="pxDayHi">–</b> / <b id="pxDayLo">–</b></span>
  </div>

  <div class="spacer"></div>
  <div class="topstat">
    <div class="ts">M1<br><b id="hM1">–</b></div>
    <div class="ts">M5<br><b id="hM5">–</b></div>
    <div class="ts">Session<br><b id="hSession">–</b></div>
    <div class="ts">UTC<br><b id="hUtc">–</b></div>
  </div>
  <a class="logout" href="/logout">ออกจากระบบ</a>
</div>
